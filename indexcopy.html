  const filterHtml = cats.length ? `<div class="filter-label">Tag</div><div class="filter-bar">${tagPills}</div>` : '';
  const filtered = filteredNotes();
  if (filtered.length === 0) return filterHtml + '<div class="empty-state">No notes match this tag.</div>';
  return filterHtml + filtered.map(n => {
    const date = n.recorded_at ? new Date(n.recorded_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
    const hood = NEIGHBORHOOD_NAMES[n.neighborhood_id] || '';
    return `<div class="note-item" onclick="flyToNote(${n.latitude},${n.longitude})">
      ${isAdmin() ? `<button class="admin-del note-del" title="Delete note" onclick='event.stopPropagation();deleteNote(${JSON.stringify(n.id)})'>${ICON.trash}</button>` : ''}
      ${n.category ? `<span class="note-cat-badge">${n.category}</span>` : ''}
      <div class="note-text">${n.text || '(empty)'}</div>
      <div class="note-meta">${[hood, date].filter(Boolean).join(' · ')}</div>
    </div>`;
  }).join('');
}

function renderActivityStats() {
  const totalDist = state.sessions.reduce((sum, s) => sum + (s.distance_meters || 0), 0) / 1609.34;
  const cards = `<div class="stats-grid">
    <div class="stat-card"><div class="stat-value">${totalDist.toFixed(1)} mi</div><div class="stat-label">Total Distance</div></div>
    <div class="stat-card"><div class="stat-value">${state.photos.length}</div><div class="stat-label">Photos</div></div>
    <div class="stat-card"><div class="stat-value">${state.notes.length}</div><div class="stat-label">Notes</div></div>
    <div class="stat-card"><div class="stat-value">${state.sightlines.length}</div><div class="stat-label">Sightlines</div></div>
    <div class="stat-card"><div class="stat-value">${state.sessions.length}</div><div class="stat-label">Walk Sessions</div></div>
  </div>`;

  // per-neighborhood
  const ids = Object.keys(NEIGHBORHOOD_NAMES);
  const rows = ids.map(id => {
    const s = hoodStats(id);
    return { id, ...s, coverage: neighborhoodCoverage(id) };
  });
  const table = `<div class="stats-section-title">Per Neighborhood</div>
    <div class="table-wrap"><table class="mini-table">
      <thead><tr><th>Area</th><th>Walks</th><th>Dist</th><th>Photos</th><th>Notes</th><th>Cov.</th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td><div class="hood-cell"><span class="hood-dot" style="background:${NEIGHBORHOOD_COLORS[r.id]}"></span>${NEIGHBORHOOD_NAMES[r.id]}</div></td>
        <td>${r.sessions}</td><td>${r.distMi.toFixed(2)}</td><td>${r.photos}</td><td>${r.notes}</td><td>${r.coverage.toFixed(0)}%</td>
      </tr>`).join('')}</tbody>
    </table></div>`;

  // coverage bar chart (% of neighborhood area walked)
  const covBars = `<div class="stats-section-title">Area Coverage</div>
    ${rows.map(r => `<div class="bar-row">
      <div class="bar-row-label"><span>${NEIGHBORHOOD_NAMES[r.id]}</span><span>${r.coverage.toFixed(0)}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${r.coverage}%;background:${NEIGHBORHOOD_COLORS[r.id]}"></div></div>
    </div>`).join('')}`;

  // photo density bar chart (photos per mile)
  const densities = rows.map(r => ({ id: r.id, density: r.distMi > 0 ? r.photos / r.distMi : 0 }));
  const maxD = Math.max(0.0001, ...densities.map(d => d.density));
  const bars = `<div class="stats-section-title">Photo Density (per mile)</div>
    ${densities.map(d => `<div class="bar-row">
      <div class="bar-row-label"><span>${NEIGHBORHOOD_NAMES[d.id]}</span><span>${d.density.toFixed(1)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(d.density / maxD) * 100}%;background:${NEIGHBORHOOD_COLORS[d.id]}"></div></div>
    </div>`).join('')}`;

  // photo categories
  const catCounts = {};
  state.photos.forEach(p => { if (p.category) catCounts[p.category] = (catCounts[p.category] || 0) + 1; });
  const cats = Object.entries(catCounts).sort((a, b) => b[1] - a[1]);
  const pills = `<div class="stats-section-title">Photo Categories</div>
    <div class="cat-pills">${cats.length ? cats.map(([c, n]) => `<span class="cat-pill">${c}<b>${n}</b></span>`).join('') : '<span class="cat-pill">None</span>'}</div>`;

  return cards + table + covBars + bars + pills;
}

// ─── DATA TAB (intersection surveys) ─────────────
const HOOD_SHORT = { ansonborough: 'Anson.', french_quarter: 'French Q.', market_street: 'Market', gadsdenboro: 'Gadsden.' };
const CONDITION_COLORS = { good: '#5BAE6E', fair: '#C39A4E', poor: '#CC6E4F' };
const CANOPY_COLORS = { none: '#5a7886', partial: '#4ba1ba', full: '#4F9E93' };

function jsStr(v) { return String(v).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function pct(n, total) { return total ? Math.round(100 * n / total) : 0; }

// survey → neighborhood map (cache invalidates when the surveys array is replaced)
let _hoodCacheStamp = null, _hoodCache = null;
function hoodBySurvey() {
  if (_hoodCacheStamp === state.intersections) return _hoodCache;
  const m = {}; state.intersections.forEach(s => { m[String(surveyId(s))] = surveyHood(s); });
  _hoodCacheStamp = state.intersections; _hoodCache = m; return m;
}
function cornerHood(c) { return hoodBySurvey()[String(cornerSurveyId(c))] || norm(c.neighborhood_id) || ''; }

function filteredSurveys() {
  return state.intersectionFilter === 'all'
    ? state.intersections
    : state.intersections.filter(s => surveyHood(s) === state.intersectionFilter);
}
function filteredCorners() {
  if (state.intersectionFilter === 'all') return state.buildingCorners;
  const ids = new Set(filteredSurveys().map(s => String(surveyId(s))));
  return state.buildingCorners.filter(c => ids.has(String(cornerSurveyId(c))));
}
function presentHoods() { return HOOD_ORDER.filter(h => state.intersections.some(s => surveyHood(s) === h)); }

function avgStories(corners) {
  const xs = corners.map(cornerStories).filter(n => n != null && !isNaN(n));
  return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
}
function dominantMaterial(corners) {
  const m = {}; corners.forEach(c => { const k = cornerMaterial(c); if (k) m[k] = (m[k] || 0) + 1; });
  const e = Object.entries(m).sort((a, b) => b[1] - a[1])[0];
  return e ? cap(e[0]) : null;
}
function countCat(items, fn, order) {
  const m = {}; order.forEach(k => m[k] = 0);
  items.forEach(it => { const k = fn(it); if (k != null && k in m) m[k]++; });
  return order.map(k => m[k]);
}
function canopyScore(surveys) {
  const v = surveys.map(surveyCanopy).filter(Boolean).map(c => c === 'full' ? 1 : c === 'partial' ? 0.5 : 0);
  return v.length ? Math.round(100 * v.reduce((a, b) => a + b, 0) / v.length) : 0;
}
function waterRate(surveys) {
  if (!surveys.length) return 0;
  const w = surveys.filter(s => sightlinesForIntersection(surveyId(s)).some(sightlineIsWater)).length;
  return Math.round(100 * w / surveys.length);
}

function pctLegendHtml(labels, data, colors) {
  const total = data.reduce((a, b) => a + (b || 0), 0);
  return `<div class="chart-pct-legend">` + labels.map((l, i) =>
    `<span class="it"><span class="sw" style="background:${colors[i]}"></span>${cap(l)} <b>${data[i]}</b> (${pct(data[i], total)}%)</span>`
  ).join('') + `</div>`;
}

function renderIntersectionsTab() {
  const hasData = state.intersections.length > 0;
  const f = state.intersectionFilter;

  // ── filter bar (top, prominent — colored + checked active state) ──
  const pill = (val, label, color) => {
    const active = f === val;
    if (active) return `<button class="xsec-pill active" style="background:${color};border-color:${color}" onclick="setIntersectionFilter('${val}')"><span class="xsec-pill-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>${label}</button>`;
    const dot = val === 'all' ? '' : `<span class="xsec-pill-dot" style="background:${color}"></span>`;
    return `<button class="xsec-pill" onclick="setIntersectionFilter('${val}')">${dot}${label}</button>`;
  };
  let html = `<div class="xsec-filter">
    <div class="xsec-filter-label">Filter by Neighborhood</div>
    <div class="xsec-filter-pills">
      ${pill('all', 'All', 'var(--accent-highlight)')}
      ${HOOD_ORDER.map(h => pill(h, NEIGHBORHOOD_NAMES[h], NEIGHBORHOOD_COLORS[h])).join('')}
    </div>
  </div>`;

  html += `<div class="stats-section-title">Intersection Surveys${f !== 'all' ? ' · ' + (NEIGHBORHOOD_NAMES[f] || '') : ''}</div>`;

  if (!hasData) {
    return html + `<div class="empty-state">No intersection surveys yet.<br>They appear here once recorded in the field.</div>`;
  }

  const fSurveys = filteredSurveys();
  const fCorners = filteredCorners();
  const avg = avgStories(fCorners);
  const wRate = waterRate(fSurveys);

  // ── summary cards ──
  html += `<div class="stats-grid">
    <div class="stat-card"><div class="stat-value">${fSurveys.length}</div><div class="stat-label">Intersections</div></div>
    <div class="stat-card"><div class="stat-value">${fCorners.length}</div><div class="stat-label">Buildings</div></div>
    <div class="stat-card"><div class="stat-value">${avg != null ? avg.toFixed(1) : '—'}</div><div class="stat-label">Avg Stories</div></div>
    <div class="stat-card"><div class="stat-value">${wRate}%</div><div class="stat-label">Water Visible</div></div>
  </div>`;

  // ── per-neighborhood counts ──
  html += `<div class="hood-count-row">` + HOOD_ORDER.map(h => {
    const n = state.intersections.filter(s => surveyHood(s) === h).length;
    if (!n) return '';
    return `<span class="hood-count-chip" onclick="setIntersectionFilter('${h}')"><span class="hd" style="background:${NEIGHBORHOOD_COLORS[h]}"></span>${NEIGHBORHOOD_NAMES[h]} <b>${n}</b></span>`;
  }).join('') + `</div>`;

  // ── charts (canvases populated by buildIntersectionCharts) ──
  const cap2 = (t, n, unit) => `<div class="chart-caption"><span class="t">${t}</span><span class="n">${n} ${unit}</span></div>`;

  html += cap2('Building Height', fCorners.length, 'buildings');
  html += `<div class="chart-box chart-h-lg"><canvas id="chart-height"></canvas></div>`;

  const matData = countCat(fCorners, cornerMaterial, MATERIALS);
  html += cap2('Material Breakdown', matData.reduce((a, b) => a + b, 0), 'buildings');
  html += `<div class="chart-box chart-h-donut"><canvas id="chart-material"></canvas></div>`;
  html += pctLegendHtml(MATERIALS, matData, MATERIALS.map(m => MATERIAL_COLORS[m]));

  html += cap2('Ground Floor Use', countCat(fCorners, cornerUse, GROUND_USES).reduce((a, b) => a + b, 0), 'buildings');
  html += `<div class="chart-box chart-h-md"><canvas id="chart-use"></canvas></div>`;

  const setData = countCat(fCorners, cornerSetback, SETBACKS);
  html += cap2('Setback Distribution', setData.reduce((a, b) => a + b, 0), 'buildings');
  html += `<div class="chart-box chart-h-sm"><canvas id="chart-setback"></canvas></div>`;
  html += pctLegendHtml(SETBACKS, setData, SETBACKS.map((s, i) => TEAL_RAMP[i + 1]));

  html += cap2('Condition Summary', countCat(fCorners, cornerCondition, CONDITIONS).reduce((a, b) => a + b, 0), 'buildings');
  html += `<div class="chart-box chart-h-sm"><canvas id="chart-condition"></canvas></div>`;

  html += cap2('Canopy Coverage', fSurveys.filter(s => surveyCanopy(s)).length, 'intersections');
  html += `<div class="chart-box chart-h-sm"><canvas id="chart-canopy"></canvas></div>`;

  html += cap2('Sidewalk Width', fSurveys.filter(s => surveySidewalk(s)).length, 'intersections');
  html += `<div class="chart-box chart-h-sm"><canvas id="chart-sidewalk"></canvas></div>`;

  // ── sightline summary ──
  html += `<div class="chart-caption"><span class="t">Sightline Summary</span></div>`;
  html += renderSightlineSummary(fSurveys);

  // ── neighborhood comparison (All only) ──
  if (state.intersectionFilter === 'all' && presentHoods().length > 1) {
    html += `<div class="data-divider"></div><div class="stats-section-title">Neighborhood Comparison</div>`;
    html += `<div class="chart-caption"><span class="t">Avg Building Height</span><span class="n">stories</span></div>`;
    html += `<div class="chart-box chart-h-md"><canvas id="chart-cmp-height"></canvas></div>`;
    html += `<div class="chart-caption"><span class="t">Material by Neighborhood</span></div>`;
    html += `<div class="chart-box chart-h-md"><canvas id="chart-cmp-material"></canvas></div>`;
    html += `<div class="chart-caption"><span class="t">Water Visibility Rate</span><span class="n">%</span></div>`;
    html += `<div class="chart-box chart-h-md"><canvas id="chart-cmp-water"></canvas></div>`;
    html += `<div class="chart-caption"><span class="t">Canopy Coverage</span><span class="n">%</span></div>`;
    html += `<div class="chart-box chart-h-md"><canvas id="chart-cmp-canopy"></canvas></div>`;
  }

  // ── intersection list ──
  html += `<div class="xsec-list-title">Intersections (${fSurveys.length})</div>`;
  html += renderIntersectionList(fSurveys);

  return html;
}

function renderSightlineSummary(fSurveys) {
  const sids = new Set(fSurveys.map(s => String(surveyId(s))));
  const scope = state.intersectionFilter === 'all'
    ? state.sightlines
    : state.sightlines.filter(sl => norm(sl.neighborhood_id) === state.intersectionFilter || sids.has(String(sightlineSurveyId(sl))));
  const total = scope.length;
  const wRate = waterRate(fSurveys);
  const byType = SIGHTLINE_TYPES.map(t => ({ t, n: scope.filter(sl => sightlineType(sl) === t).length }));
  const maxN = Math.max(1, ...byType.map(x => x.n));

  const bars = byType.map(({ t, n }) => `
    <div class="bar-row">
      <div class="bar-row-label"><span>${SIGHTLINE_TYPE_LABELS[t]}</span><span>${n} (${pct(n, total)}%)</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(n / maxN) * 100}%;background:${SIGHTLINE_TYPE_COLORS[t]}"></div></div>
    </div>`).join('');

  return `<div class="sl-summary">
    <div class="sl-summary-top"><span class="big">${total}</span><span class="lbl">Sightlines Recorded</span></div>
    ${bars}
    <div class="sl-water-rate">Water visible at <b>${wRate}%</b> of intersections</div>
  </div>`;
}

function renderIntersectionList(fSurveys) {
  if (!fSurveys.length) return '<div class="empty-state">No intersections in this view.</div>';
  const sorted = fSurveys.slice().sort((a, b) => new Date(surveyDate(b) || 0) - new Date(surveyDate(a) || 0));
  return sorted.map(s => {
    const sid = surveyId(s);
    const hood = surveyHood(s);
    const color = NEIGHBORHOOD_COLORS[hood] || '#555';
    const corners = cornersFor(sid);
    const d = surveyDate(s);
    const date = d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
    const avg = avgStories(corners);
    const dom = dominantMaterial(corners);
    const canopy = surveyCanopy(s), sw = surveySidewalk(s);
    const sl = sightlinesForIntersection(sid).length;
    const active = String(state.activeIntersection) === String(sid);
    const noLoc = !surveyHasLocation(s);
    return `<div class="xsec-item ${active ? 'active' : ''}" onclick="focusIntersection('${jsStr(sid)}')">
      <div class="xsec-item-bar" style="background:${color}"></div>
      <div class="xsec-item-body">
        <div class="xsec-item-top">
          <span class="xsec-item-name">${NEIGHBORHOOD_NAMES[hood] || 'Intersection'}</span>
          <span class="xsec-item-n">${corners.length} bldg${corners.length === 1 ? '' : 's'}</span>
        </div>
        <div class="xsec-item-meta">${[date, avg != null ? `avg ${avg.toFixed(1)} stories` : null, dom].filter(Boolean).join(' · ')}</div>
        <div class="xsec-item-tags">
          ${noLoc ? `<span class="xsec-item-tag xsec-tag-warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>No location</span>` : ''}
          ${canopy ? `<span class="xsec-item-tag">Canopy: ${canopy}</span>` : ''}
          ${sw ? `<span class="xsec-item-tag">${sw} sidewalk</span>` : ''}
          <span class="xsec-item-tag">${sl} sightline${sl === 1 ? '' : 's'}</span>
        </div>
      </div>
      ${isAdmin() ? `<button class="admin-del" style="align-self:center" title="Delete intersection" onclick="event.stopPropagation();deleteIntersection('${jsStr(sid)}')">${ICON.trash}</button>` : ''}
    </div>`;
  }).join('');
}

function setIntersectionFilter(f) { state.intersectionFilter = f; renderSidebar(); }

// ─── CHART.JS BUILDERS ───────────────────────────
let _chartDefaultsSet = false;
function setupChartDefaults() {
  if (_chartDefaultsSet || typeof Chart === 'undefined') return;
  Chart.defaults.color = CHART_TICK;
  Chart.defaults.font.family = "'IBM Plex Mono', ui-monospace, monospace";
  Chart.defaults.font.size = 10;
  Chart.defaults.borderColor = CHART_GRID;
  Chart.defaults.animation = { duration: 350 };
  // themed tooltips (Chart.js defaults are light-on-dark and clash with the brand theme)
  const tt = Chart.defaults.plugins.tooltip;
  tt.backgroundColor = 'rgba(8,29,52,0.97)';
  tt.titleColor = CHART_VALUE;
  tt.bodyColor = CHART_VALUE;
  tt.bodyFont = { family: "'IBM Plex Mono', monospace" };
  tt.borderColor = 'rgba(255,255,255,0.12)';
  tt.borderWidth = 1;
  tt.padding = 9;
  tt.cornerRadius = 6;
  tt.titleFont = { weight: '600', family: "'DM Sans', sans-serif" };
  tt.displayColors = false;
  _chartDefaultsSet = true;
}
function mkChart(id, config) {
  const cv = document.getElementById(id);
  if (!cv) return null;
  const ch = new Chart(cv.getContext('2d'), config);
  chartInstances.push(ch);
  return ch;
}
function pctLabel(arr, useLabel) {
  const total = arr.reduce((a, b) => a + (b || 0), 0);
  return (ctx) => {
    const val = Number(ctx.raw) || 0;
    const p = total ? Math.round(100 * val / total) : 0;
    const nm = useLabel ? ctx.label : (ctx.dataset.label || '');
    return `${nm ? nm + ': ' : ''}${val} (${p}%)`;
  };
}
const catScales = (countAxis = 'x') => ({
  x: { beginAtZero: countAxis === 'x', stacked: false, grid: { color: CHART_GRID, drawBorder: false }, ticks: { color: CHART_TICK, precision: 0 } },
  y: { beginAtZero: countAxis === 'y', stacked: false, grid: { display: false, drawBorder: false }, ticks: { color: CHART_TICK } }
});

// horizontal single-series count bar
function horizBar(id, labels, data, colors) {
  mkChart(id, {
    type: 'bar',
    data: { labels: labels.map(cap), datasets: [{ data, backgroundColor: colors, borderWidth: 0, borderRadius: 3, maxBarThickness: 20 }] },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: pctLabel(data) } } },
      scales: catScales('x')
    }
  });
}

function buildIntersectionCharts() {
  if (typeof Chart === 'undefined' || !state.intersections.length) return;
  setupChartDefaults();
  const fSurveys = filteredSurveys();
  const fCorners = filteredCorners();
  const filtered = state.intersectionFilter !== 'all';

  // ── Building height distribution ──
  if (filtered) {
    const data = countCat(fCorners, cornerStoryBucket, STORY_BUCKETS);
    mkChart('chart-height', {
      type: 'bar',
      data: { labels: STORY_BUCKETS, datasets: [{ label: NEIGHBORHOOD_NAMES[state.intersectionFilter], data, backgroundColor: TEAL, borderWidth: 0, borderRadius: 3, maxBarThickness: 22 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: pctLabel(data) } } },
        scales: { x: { beginAtZero: true, grid: { color: CHART_GRID, drawBorder: false }, ticks: { color: CHART_TICK, precision: 0 } }, y: { grid: { display: false, drawBorder: false }, ticks: { color: CHART_TICK }, title: { display: true, text: 'Stories', color: CHART_TICK } } }
      }
    });
  } else {
    const hoods = presentHoods();
    const datasets = hoods.map(h => ({
      label: NEIGHBORHOOD_NAMES[h],
      data: countCat(state.buildingCorners.filter(c => cornerHood(c) === h), cornerStoryBucket, STORY_BUCKETS),
      backgroundColor: NEIGHBORHOOD_COLORS[h], borderWidth: 0, borderRadius: 2, maxBarThickness: 24
    }));
    mkChart('chart-height', {
      type: 'bar',
      data: { labels: STORY_BUCKETS, datasets },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: true, position: 'top', labels: { color: CHART_TICK, boxWidth: 10, boxHeight: 10, padding: 8, font: { size: 9 } } } },
        scales: { x: { stacked: true, beginAtZero: true, grid: { color: CHART_GRID, drawBorder: false }, ticks: { color: CHART_TICK, precision: 0 } }, y: { stacked: true, grid: { display: false, drawBorder: false }, ticks: { color: CHART_TICK }, title: { display: true, text: 'Stories', color: CHART_TICK } } }
      }
    });
  }

  // ── Material donut ──
  const matData = countCat(fCorners, cornerMaterial, MATERIALS);
  mkChart('chart-material', {
    type: 'doughnut',
    data: { labels: MATERIALS.map(cap), datasets: [{ data: matData, backgroundColor: MATERIALS.map(m => MATERIAL_COLORS[m]), borderColor: '#0c2742', borderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: pctLabel(matData, true) } } } }
  });

  // ── Ground floor use ──
  horizBar('chart-use', GROUND_USES, countCat(fCorners, cornerUse, GROUND_USES), GROUND_USES.map((_, i) => TEAL_RAMP[i]));

  // ── Setback ──
  horizBar('chart-setback', SETBACKS, countCat(fCorners, cornerSetback, SETBACKS), SETBACKS.map((_, i) => TEAL_RAMP[i + 1]));

  // ── Condition ──
  horizBar('chart-condition', CONDITIONS, countCat(fCorners, cornerCondition, CONDITIONS), CONDITIONS.map(c => CONDITION_COLORS[c]));

  // ── Canopy ──
  horizBar('chart-canopy', CANOPIES, countCat(fSurveys, surveyCanopy, CANOPIES), CANOPIES.map(c => CANOPY_COLORS[c]));

  // ── Sidewalk ──
  horizBar('chart-sidewalk', SIDEWALKS, countCat(fSurveys, surveySidewalk, SIDEWALKS), SIDEWALKS.map((_, i) => TEAL_RAMP[i + 1]));

  // ── Comparison charts (All only) ──
  if (!filtered && presentHoods().length > 1) {
    const hoods = presentHoods();
    const labels = hoods.map(h => HOOD_SHORT[h] || NEIGHBORHOOD_NAMES[h]);
    const hoodColors = hoods.map(h => NEIGHBORHOOD_COLORS[h]);

    // avg height
    const heights = hoods.map(h => { const a = avgStories(state.buildingCorners.filter(c => cornerHood(c) === h)); return a != null ? +a.toFixed(2) : 0; });
    mkChart('chart-cmp-height', {
      type: 'bar',
      data: { labels, datasets: [{ data: heights, backgroundColor: hoodColors, borderWidth: 0, borderRadius: 3, maxBarThickness: 40 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false, drawBorder: false }, ticks: { color: CHART_TICK } }, y: { beginAtZero: true, grid: { color: CHART_GRID, drawBorder: false }, ticks: { color: CHART_TICK } } } }
    });

    // material stacked per hood
    const matDatasets = MATERIALS.map(m => ({
      label: cap(m),
      data: hoods.map(h => state.buildingCorners.filter(c => cornerHood(c) === h && cornerMaterial(c) === m).length),
      backgroundColor: MATERIAL_COLORS[m], borderWidth: 0, stack: 'mat', maxBarThickness: 40
    }));
    mkChart('chart-cmp-material', {
      type: 'bar',
      data: { labels, datasets: matDatasets },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: 'top', labels: { color: CHART_TICK, boxWidth: 10, boxHeight: 10, padding: 8, font: { size: 9 } } } }, scales: { x: { stacked: true, grid: { display: false, drawBorder: false }, ticks: { color: CHART_TICK } }, y: { stacked: true, beginAtZero: true, grid: { color: CHART_GRID, drawBorder: false }, ticks: { color: CHART_TICK, precision: 0 } } } }
    });

    // water visibility rate per hood
    const water = hoods.map(h => waterRate(state.intersections.filter(s => surveyHood(s) === h)));
    mkChart('chart-cmp-water', {
      type: 'bar',
      data: { labels, datasets: [{ data: water, backgroundColor: hoodColors, borderWidth: 0, borderRadius: 3, maxBarThickness: 40 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.raw}%` } } }, scales: { x: { grid: { display: false, drawBorder: false }, ticks: { color: CHART_TICK } }, y: { beginAtZero: true, max: 100, grid: { color: CHART_GRID, drawBorder: false }, ticks: { color: CHART_TICK, callback: v => v + '%' } } } }
    });

    // canopy coverage per hood
    const canopy = hoods.map(h => canopyScore(state.intersections.filter(s => surveyHood(s) === h)));
    mkChart('chart-cmp-canopy', {
      type: 'bar',
      data: { labels, datasets: [{ data: canopy, backgroundColor: hoodColors, borderWidth: 0, borderRadius: 3, maxBarThickness: 40 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.raw}%` } } }, scales: { x: { grid: { display: false, drawBorder: false }, ticks: { color: CHART_TICK } }, y: { beginAtZero: true, max: 100, grid: { color: CHART_GRID, drawBorder: false }, ticks: { color: CHART_TICK, callback: v => v + '%' } } } }
    });
  }
}

// ─── ADMIN DELETE (requires Supabase login) ──────
function isAdmin() { return !!state.accessToken; }

// Deletes and confirms rows were actually removed. PostgREST + RLS can return success while
// deleting 0 rows (no DELETE policy) — `Prefer: return=representation` lets us detect that.
async function supaDelete(table, query, opts = {}) {
  const res = await authedFetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
    method: 'DELETE', headers: { 'Prefer': 'return=representation' }
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  let rows = null;
  try { rows = await res.json(); } catch (e) {}
  if (opts.requireRows !== false && Array.isArray(rows) && rows.length === 0) {
    throw new Error(`Nothing was deleted from "${table}". Your account may not have delete permission — check that table's Row Level Security (RLS) policy in Supabase.`);
  }
  return Array.isArray(rows) ? rows : [];
}

async function deleteSession(id) {
  if (!isAdmin()) return;
  const s = state.sessions.find(x => x.id === id);
  const label = s ? `${NEIGHBORHOOD_NAMES[s.start_neighborhood_id] || 'walk'} (${new Date(s.start_date).toLocaleDateString()})` : 'this walk';
  if (!confirm(`Delete ${label} and all its track points? This cannot be undone.`)) return;
  try {
    await supaDelete('track_points', `session_id=eq.${id}`, { requireRows: false });
    await supaDelete('walk_sessions', `id=eq.${id}`);
    state.sessions = state.sessions.filter(x => x.id !== id);
    delete state.trackPoints[id];
    if (state.activeSession === id) state.activeSession = null;
    refreshMap();
    renderSidebar();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

async function deleteNote(id) {
  if (!isAdmin()) return;
  if (!confirm('Delete this note? This cannot be undone.')) return;
  try {
    await supaDelete('notes', `id=eq.${id}`);
    state.notes = state.notes.filter(n => n.id !== id);
    refreshMap();
    renderSidebar();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

async function deletePhoto(id) {
  if (!isAdmin()) return;
  if (!confirm('Delete this photo? This cannot be undone.')) return;
  try {
    await supaDelete('photos', `id=eq.${id}`);
    state.photos = state.photos.filter(p => p.id !== id);
    drawPhotos();
    renderSidebar();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

// Delete a whole intersection survey + its buildings + its linked sightlines.
// We delete child rows by their own id (robust regardless of the FK column name).
async function deleteIntersection(sid) {
  if (!isAdmin()) return;
  const s = state.intersections.find(x => String(surveyId(x)) === String(sid));
  const corners = cornersFor(sid);
  const sls = sightlinesForIntersection(sid);
  const label = s ? (NEIGHBORHOOD_NAMES[surveyHood(s)] || 'this intersection') : 'this intersection';
  const extra = `${corners.length} building${corners.length === 1 ? '' : 's'}` + (sls.length ? ` and ${sls.length} sightline${sls.length === 1 ? '' : 's'}` : '');
  if (!confirm(`Delete ${label} survey (${extra})? This cannot be undone.`)) return;
  try {
    const cornerIds = corners.map(c => c.id).filter(v => v != null);
    if (cornerIds.length) await supaDelete('building_corners', `id=in.(${cornerIds.join(',')})`, { requireRows: false });
    const slIds = sls.map(sl => sl.id).filter(v => v != null);
    if (slIds.length) await supaDelete('sightline_observations', `id=in.(${slIds.join(',')})`, { requireRows: false });
    await supaDelete('intersection_surveys', `id=eq.${sid}`);
    // update local state
    const slIdSet = new Set(slIds.map(String));
    state.intersections = state.intersections.filter(x => String(surveyId(x)) !== String(sid));
    state.buildingCorners = state.buildingCorners.filter(c => String(cornerSurveyId(c)) !== String(sid));
    delete state.cornersBySurvey[sid];
    state.sightlines = state.sightlines.filter(sl => !slIdSet.has(String(sl.id)));
    if (state.activeIntersection === sid) state.activeIntersection = null;
    refreshMap();
    renderSidebar();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

// Delete a single building from an intersection survey.
async function deleteBuilding(cornerId, sid) {
  if (!isAdmin()) return;
  if (!confirm('Delete this building from the survey? This cannot be undone.')) return;
  try {
    await supaDelete('building_corners', `id=eq.${cornerId}`);
    state.buildingCorners = state.buildingCorners.filter(c => String(c.id) !== String(cornerId));
    if (state.cornersBySurvey[sid]) state.cornersBySurvey[sid] = state.cornersBySurvey[sid].filter(c => String(c.id) !== String(cornerId));
    drawIntersections(); // refresh the dots
    const marker = intersectionMarkerById[sid];
    const s = state.intersections.find(x => String(surveyId(x)) === String(sid));
    if (marker && s) { marker.setPopupContent(intersectionPopupHtml(s)); marker.openPopup(); }
    renderSidebar();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

// ─── REFRESH ─────────────────────────────────────
let refreshing = false;
async function refreshData() {
  if (refreshing) return;
  refreshing = true;
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.classList.add('spinning');
  // Reset in-memory data so deletions in Supabase are reflected.
  state.sessions = []; state.trackPoints = {}; state.photos = []; state.notes = []; state.sightlines = []; state.screenshots = [];
  state.intersections = []; state.buildingCorners = []; state.cornersBySurvey = {};
  state.activeSession = null; state.activeIntersection = null;
  stopAnimation();
  await loadAllData();
  refreshMap();
  renderSidebar();
  if (state.demoAdmin) renderDemoAdmin();
  renderDemo();
  if (btn) btn.classList.remove('spinning');
  refreshing = false;
}

// ─── AUTH (Supabase) ─────────────────────────────
function openLogin() {
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-modal').classList.add('open');
  document.getElementById('login-email').focus();
}
function closeLogin() { document.getElementById('login-modal').classList.remove('open'); }

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-submit');
  if (!email || !password) { errEl.textContent = 'Enter email and password.'; return; }
  errEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok || !data.access_token) {
      errEl.textContent = data.error_description || data.msg || 'Login failed.';
    } else {
      setSession(data.access_token, (data.user && data.user.email) || email, data.refresh_token || null);
      try {
        localStorage.setItem('up_token', data.access_token);
        localStorage.setItem('up_email', state.userEmail);
        if (data.refresh_token) localStorage.setItem('up_refresh', data.refresh_token);
      } catch (e) {}
      closeLogin();
      document.getElementById('login-password').value = '';
    }
  } catch (e) {
    errEl.textContent = 'Network error. Try again.';
  }
  btn.disabled = false; btn.textContent = 'Sign In';
}

function setSession(token, email, refresh) {
  state.accessToken = token;
  state.userEmail = email;
  if (refresh !== undefined) state.refreshToken = refresh;
  updateAuthUI();
  renderSidebar();
}

function doLogout() {
  state.accessToken = null;
  state.refreshToken = null;
  state.userEmail = null;
  state.demoAdmin = false;
  document.getElementById('demo-admin').style.display = 'none';
  document.getElementById('demo-overlay').classList.remove('admin-open');
  try { localStorage.removeItem('up_token'); localStorage.removeItem('up_email'); localStorage.removeItem('up_refresh'); } catch (e) {}
  updateAuthUI();
  renderSidebar();
}

function updateAuthUI() {
  const area = document.getElementById('auth-area');
  if (state.accessToken) {
    area.innerHTML = `<span class="auth-logged" title="${state.userEmail || ''}">
      <span class="auth-dot"></span>Logged in
      <span class="logout-link" onclick="doLogout()">Logout</span>
    </span>`;
  } else {
    area.innerHTML = `<button class="icon-btn footer-auth-btn" id="login-btn" onclick="openLogin()" title="Log in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/></svg>
    </button>`;
  }
}

// ── token lifetime + refresh ──
function jwtExpMs(token) {
  try {
    const part = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const payload = JSON.parse(atob(part));
    return payload.exp ? payload.exp * 1000 : 0;
  } catch (e) { return 0; }
}
function tokenExpired() {
  if (!state.accessToken) return false;
  const exp = jwtExpMs(state.accessToken);
  return exp > 0 && Date.now() > exp - 60000; // treat as expired 60s early to be safe
}
// Exchange the refresh token for a fresh access token. Returns true on success.
async function refreshSession() {
  const rt = state.refreshToken;
  if (!rt) return false;
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: rt })
    });
    const data = await res.json();
    if (res.ok && data.access_token) {
      state.accessToken = data.access_token;
      state.refreshToken = data.refresh_token || rt;
      if (data.user && data.user.email) state.userEmail = data.user.email;
      try {
        localStorage.setItem('up_token', state.accessToken);
        localStorage.setItem('up_refresh', state.refreshToken);
        if (state.userEmail) localStorage.setItem('up_email', state.userEmail);
      } catch (e) {}
      updateAuthUI();
      return true;
    }
  } catch (e) {}
  return false;
}
// Authenticated write: refresh proactively if the token is stale, then fetch.
// On a 401 (e.g. JWT expired), refresh once and retry; if still 401, log out with a clear message.
async function authedFetch(url, options = {}) {
  if (tokenExpired()) await refreshSession();
  const build = () => Object.assign({}, options, { headers: writeHeaders(options.headers || {}) });
  let res = await fetch(url, build());
  if (res.status === 401 && await refreshSession()) res = await fetch(url, build());
  if (res.status === 401) { doLogout(); throw new Error('Your admin session expired — please log in again.'); }
  return res;
}

function restoreSession() {
  try {
    const token = localStorage.getItem('up_token');
    if (token) {
      setSession(token, localStorage.getItem('up_email') || '', localStorage.getItem('up_refresh'));
      // If the saved token is already expired, refresh it now (or log out if we can't).
      if (tokenExpired()) refreshSession().then(ok => { if (!ok) doLogout(); });
    }
  } catch (e) {}
}

// ─── INIT ────────────────────────────────────────
async function init() {
  restoreSession();
  initMap();
  await loadAllData();
  refreshMap();
  renderSidebar();
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.add('loaded');
}

document.addEventListener('keydown', e => {
  const loginOpen = document.getElementById('login-modal').classList.contains('open');
  if (loginOpen) {
    if (e.key === 'Escape') closeLogin();
    if (e.key === 'Enter') doLogin();
    return;
  }
  const demoOpen = document.getElementById('demo-overlay').classList.contains('open');
  if (e.key === 'Escape') {
    if (demoOpen) { closeDemo(); return; }
    closeLightbox();
    closeHoodCard();
    stopAnimation();
  }
  if (demoOpen) {
    if (e.key === 'ArrowLeft') demoNav(-1);
    if (e.key === 'ArrowRight') demoNav(1);
  }
});

// close demo when clicking outside the phone/controls
document.getElementById('demo-overlay').addEventListener('click', e => {
  if (e.target.id === 'demo-overlay') closeDemo();
});

init();
